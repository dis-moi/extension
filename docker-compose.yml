# Development databases for the API that replaces the PHP backend.
#
# The version is the one of production, read in the header of the dump
# (`Server version: 8.0.33-25`) and not the one `.env` and the compose file of
# the backend both announced, which spoke of MariaDB 10.2. Developing against
# the wrong engine means discovering the dialect differences at cutover.
#
#   yarn db:up        starts both databases
#   yarn db:restore   loads the dump into the development database
#   yarn db:down      stops everything, without erasing the volumes

services:
  db:
    container_name: dismoi-api-devdb
    image: mysql:8.0.33
    command:
      # The dump is in utf8mb3; the server has to accept it without converting.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # The `sql_mode` stays the MySQL 8 default, `ONLY_FULL_GROUP_BY`
      # included. Checked: the inherited schema loads without error, and the
      # aggregate query of `GET /contributors` passes — the selected columns
      # depend functionally on the grouped primary key, which MySQL 8 can
      # recognise. Developing under the strictest mode guarantees that
      # production, whose setting is unknown to us, will refuse nothing.
    ports:
      - '3310:3306'
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: dismoi
      MYSQL_USER: dismoi
      MYSQL_PASSWORD: dev
    volumes:
      - devdb:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-pdev']
      interval: 3s
      timeout: 5s
      retries: 30

  # A separate database for the tests: they truncate and reload tables, which
  # is not something to let happen to the working database.
  dbtest:
    container_name: dismoi-api-testdb
    image: mysql:8.0.33
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '3311:3306'
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: dismoi_test
      MYSQL_USER: dismoi
      MYSQL_PASSWORD: dev
    # The tests start from a fresh schema every time: no volume, so no state
    # survives a `db:down`.
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-pdev']
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  devdb:
