name: Release

# Publishing means sending an extension to Google and Mozilla: irreversible
# and subject to review. It cannot be the automatic consequence of a merge on
# the default branch. It is triggered by hand, from the Actions tab or through
# `gh workflow run release.yml`, when someone decides that this version ships.
on:
  workflow_dispatch:
    inputs:
      simulation:
        description: >-
          Compute the next version and the notes without publishing
          or tagging anything.
        type: boolean
        default: false

# One release at a time: two concurrent runs would fight over the version tag
# and the store would refuse the second.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # `nx release` commits, and the `pre-commit` hook would run `lint-staged` in
  # an environment where it has nothing to do: the checks already run as
  # explicit steps below.
  HUSKY_SKIP_HOOKS: 1

jobs:
  release:
    name: nx release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `nx release` reads the history and the tags to determine the
          # current version and the range of commits to analyse.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn 4
        run: corepack enable

      - name: Cache the packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable

      # A release leaves for the stores: it is not launched on code that does
      # not pass its own tests.
      - name: Lint
        run: yarn lint

      - name: Tests
        run: yarn test

      - name: Commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Infers the version from the commit messages since the last tag, writes
      # it into the manifests, generates the changelog, commits and tags.
      # `--skip-publish` sets aside `nx release publish`, which targets an npm
      # registry: these artefacts leave for Google and Mozilla.
      - name: Version
        run: yarn nx release --skip-publish ${{ inputs.simulation && '--dry-run' || '' }}

      # `nx release` cannot push: the global command exposes no `--git-push`
      # and `release.git` has no corresponding option. The tags it lays down
      # are annotated, hence `--follow-tags`.
      - name: Push the commit and the tag
        if: ${{ !inputs.simulation }}
        run: git push --follow-tags origin "HEAD:${GITHUB_REF_NAME}"

      # The archives read the version from the root `package.json`, which the
      # previous step has just updated.
      - name: Build the six archives
        if: ${{ !inputs.simulation }}
        run: yarn zip:all

      - name: Submit to the stores
        if: ${{ !inputs.simulation }}
        run: node bin/submit.mjs staging && node bin/submit.mjs proding && node bin/submit.mjs production
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
