name: Publication

# Publier, c'est envoyer une extension chez Google et Mozilla : irréversible et
# soumis à examen. Ça ne peut pas être la conséquence automatique d'une fusion
# sur la branche par défaut. On le déclenche à la main, depuis l'onglet
# Actions ou par `gh workflow run release.yml`, quand on décide « cette
# version-là part ».
on:
  workflow_dispatch:
    inputs:
      simulation:
        description: >-
          Calculer la prochaine version et les notes sans rien publier
          ni étiqueter.
        type: boolean
        default: false

# Une publication à la fois : deux exécutions concurrentes se disputeraient
# l'étiquette de version et le store refuserait la seconde.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # `nx release` commite, et le crochet `pre-commit` lancerait `lint-staged`
  # dans un environnement où il n'a rien à y faire : les vérifications
  # tournent déjà en étapes explicites ci-dessous.
  HUSKY_SKIP_HOOKS: 1

jobs:
  publier:
    name: nx release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `nx release` lit l'historique et les étiquettes pour déterminer la
          # version courante et la plage de commits à analyser.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activer Yarn 4
        run: corepack enable

      - name: Cache des paquets
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Installer
        run: yarn install --immutable

      # Une publication part vers des stores : on ne la lance pas sur du code
      # qui ne passe pas ses propres tests.
      - name: Lint
        run: yarn lint

      - name: Tests
        run: yarn test

      - name: Identité des commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Déduit la version des messages de commit depuis la dernière étiquette,
      # l'écrit dans les manifestes, génère le changelog, commite et étiquette.
      # `--skip-publish` écarte `nx release publish`, qui vise un registre
      # npm : nos artefacts partent chez Google et Mozilla.
      - name: Versionner
        run: yarn nx release --skip-publish ${{ inputs.simulation && '--dry-run' || '' }}

      # `nx release` ne sait pas pousser : la commande globale n'expose pas
      # `--git-push` et `release.git` n'a pas d'option correspondante. Les
      # étiquettes qu'elle pose sont annotées, d'où `--follow-tags`.
      - name: Pousser le commit et l'étiquette
        if: ${{ !inputs.simulation }}
        run: git push --follow-tags origin "HEAD:${GITHUB_REF_NAME}"

      # Les archives lisent la version dans le `package.json` racine, que
      # l'étape précédente vient de mettre à jour.
      - name: Construire les six archives
        if: ${{ !inputs.simulation }}
        run: yarn zip:all

      - name: Soumettre aux stores
        if: ${{ !inputs.simulation }}
        run: node bin/submit.mjs staging && node bin/submit.mjs proding && node bin/submit.mjs production
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
