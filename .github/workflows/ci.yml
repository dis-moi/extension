name: Integration

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Yarn binary is versioned (`yarnPath` in .yarnrc.yml): corepack
      # only lays down the relay that finds it.
      - name: Enable Yarn 4
        run: corepack enable

      # `enableGlobalCache` is false: the cache lives in the repository and is
      # not versioned. Without this step, every run downloads 287 MB again.
      - name: Cache the packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Tests
        run: yarn test

      - name: Build the extension (Chrome)
        run: yarn build:chromium

      - name: Build the extension (Firefox)
        run: yarn build:firefox

      - name: Build the site
        run: yarn build:web

      # This one blocks: `packages/api` is at zero errors under `strict`,
      # `exactOptionalPropertyTypes` and `noUncheckedIndexedAccess`. It is the
      # code written to replace the PHP backend, and nothing justifies letting
      # it drift while the legacy is being cleaned up.
      - name: Typecheck the API
        run: yarn nx typecheck api

  types:
    name: Types
    runs-on: ubuntu-latest
    # NOT BLOCKING, and that is an admission: `yarn typecheck` reports 220
    # pre-existing errors — mostly sagas with no return type and `catch (e)`
    # as `unknown`, in packages/extension (135), packages/ui (37) and
    # packages/domain (2). Making them blocking today would paint the pipeline
    # red permanently, which amounts to not having one. None comes from
    # packages/api or packages/web: `web` only reports them because it
    # compiles the legacy sources it imports. To be removed as soon as the
    # count reaches zero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn 4
        run: corepack enable

      - name: Cache the packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck
